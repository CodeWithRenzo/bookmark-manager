    urlInput.setAttribute('aria-required', 'true');
    urlInput.setAttribute('aria-describedby', 'bm-url-hint bm-url-error');
    urlInput.setAttribute('data-autofocus', '');

    const urlHint = el('p', 'hint', 'Only http:// and https:// addresses are accepted.');
    urlHint.id = 'bm-url-hint';

    const urlError = el('p', 'field-error');
    urlError.id = 'bm-url-error';
    urlError.hidden = true;

    urlField.append(urlLabel, urlInput, urlHint, urlError);

    /* ---------------- Title ---------------- */
    const titleField = el('div', 'field');
    const titleLabel = el('label', null, 'Title');
    titleLabel.htmlFor = 'bm-title';
    titleLabel.appendChild(el('span', 'req', ' *'));

    const titleInput = el('input');
    titleInput.id = 'bm-title';
    titleInput.type = 'text';
    titleInput.autocomplete = 'off';
    titleInput.maxLength = LIMITS.title;
    titleInput.placeholder = 'A short, recognisable name';
    titleInput.value = draft.title;
    titleInput.setAttribute('aria-required', 'true');
    titleInput.setAttribute('aria-describedby', 'bm-title-error');

    const titleError = el('p', 'field-error');
    titleError.id = 'bm-title-error';
    titleError.hidden = true;

    titleField.append(titleLabel, titleInput, titleError);

    /* ---------------- Description ---------------- */
    const descField = el('div', 'field');
    const descLabel = el('label', null, 'Description');
    descLabel.htmlFor = 'bm-desc';

    const descInput = el('textarea');
    descInput.id = 'bm-desc';
    descInput.maxLength = LIMITS.description;
    descInput.placeholder = 'Why is this worth keeping? (optional)';
    descInput.value = draft.description;

    descField.append(descLabel, descInput);

    /* ---------------- Category ---------------- */
    const catField = el('div', 'field');
    const catLabel = el('label', null, 'Category');
    catLabel.htmlFor = 'bm-category';

    const catInput = el('input');
    catInput.id = 'bm-category';
    catInput.type = 'text';
    catInput.autocomplete = 'off';
    catInput.maxLength = LIMITS.category;
    catInput.setAttribute('list', 'bm-category-options');
    catInput.placeholder = 'Choose or type a new category';
    catInput.value = categoryName(draft.categoryId) || '';

    const catList = el('datalist');
    catList.id = 'bm-category-options';
    for (const category of data.categories) {
      const option = el('option');
      option.value = category.name;
      catList.appendChild(option);
    }

    const catHint = el('p', 'hint', 'Type a name that does not exist yet to create it.');
    catField.append(catLabel, catInput, catList, catHint);

    /* ---------------- Tags ---------------- */
    const tagField = el('div', 'field');
    const tagLabel = el('label', null, 'Tags');
    tagLabel.htmlFor = 'bm-tags';

    const tagInput = el('input');
    tagInput.id = 'bm-tags';
    tagInput.type = 'text';
    tagInput.autocomplete = 'off';
    tagInput.maxLength = LIMITS.tagsPerBookmark * (LIMITS.tag + 2);
    tagInput.placeholder = 'design, reading, tools';
    tagInput.value = draft.tags.join(', ');
    tagInput.setAttribute('aria-describedby', 'bm-tags-hint');

    const tagHint = el('p', 'hint', 'Separate tags with commas. Tags are stored in lowercase.');
    tagHint.id = 'bm-tags-hint';
    tagField.append(tagLabel, tagInput, tagHint);

    /* ---------------- Favorite ---------------- */
    const favLabel = el('label', 'checkbox');
    const favInput = el('input');
    favInput.type = 'checkbox';
    favInput.id = 'bm-favorite';
    favInput.checked = draft.favorite;
    favLabel.append(favInput, el('span', null, 'Add to favorites'));

    form.append(urlField, titleField, descField, catField, tagField, favLabel);

    /* ---------------- Behaviour ---------------- */
    function clearFieldError(input, errorEl) {
      input.removeAttribute('aria-invalid');
      errorEl.hidden = true;
      errorEl.textContent = '';
    }

    function showFieldError(input, errorEl, message, extraNode) {
      input.setAttribute('aria-invalid', 'true');
      errorEl.textContent = message;
      errorEl.hidden = false;
      if (extraNode) errorEl.appendChild(extraNode);
    }

    urlInput.addEventListener('input', () => clearFieldError(urlInput, urlError));
    titleInput.addEventListener('input', () => clearFieldError(titleInput, titleError));

    // Derive a starting title from the URL when the field is still empty.
    urlInput.addEventListener('blur', () => {
      if (titleInput.value.trim()) return;
      const normalized = normalizeUrl(urlInput.value);
      if (!normalized) return;
      titleInput.value = titleFromUrl(normalized).slice(0, LIMITS.title);
    });

    function submitForm() {
      clearFieldError(urlInput, urlError);
      clearFieldError(titleInput, titleError);

      const normalizedUrl = normalizeUrl(urlInput.value);
      if (!normalizedUrl) {
        showFieldError(urlInput, urlError, 'Enter a valid http:// or https:// web address.');
        urlInput.focus();
        return;
      }

      const title = cleanText(titleInput.value, LIMITS.title);
      if (!title) {
        showFieldError(titleInput, titleError, 'Give this bookmark a title.');
        titleInput.focus();
        return;
      }

      // Duplicate detection on the normalised URL (case-insensitive).
      const duplicate = data.bookmarks.find((b) =>
        !b.deleted &&
        b.url.toLowerCase() === normalizedUrl.toLowerCase() &&
        (!existing || b.id !== existing.id)
      );

      if (duplicate) {
        const review = el('button', 'btn btn--sm');
        review.type = 'button';
        review.textContent = 'Review it';
        review.addEventListener('click', () => {
          closeDialog();
          focusBookmark(duplicate.id);
        });
        showFieldError(urlInput, urlError,
          'This URL is already saved as “' + truncate(duplicate.title, 48) + '”.', review);
        urlInput.focus();
        return;
      }

      const categoryNameValue = cleanText(catInput.value, LIMITS.category);
      const categoryId = categoryNameValue ? findOrCreateCategory(categoryNameValue, data.categories) : null;
      const tags = sanitizeTags(tagInput.value);
      const description = cleanMultiline(descInput.value, LIMITS.description);
      const timestamp = nowIso();

      if (existing) {
        existing.url = normalizedUrl;
        existing.title = title;
        existing.description = description;
        existing.categoryId = categoryId;
        existing.tags = tags;
        existing.favorite = favInput.checked;
        existing.updatedAt = timestamp;
      } else {
        data.bookmarks.unshift({
          id: uid('bm'),
          url: normalizedUrl,
          title: title,
          description: description,
          categoryId: categoryId,
          tags: tags,
          favorite: favInput.checked,
          archived: false,
          deleted: false,
          deletedAt: null,
          createdAt: timestamp,
          updatedAt: timestamp
        });
      }

      const saved = persist();
      closeDialog();
      render();

      if (saved) {
        toast(existing ? 'Bookmark updated.' : 'Bookmark added.');
      }
    }

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      submitForm();
    });

    const footer = buildDialogFooter([
      { label: 'Cancel', onClick: () => true },
      { label: isEdit ? 'Save changes' : 'Add bookmark', variant: 'primary', onClick: submitForm }
    ]);
    // The primary footer button must not close the dialog on its own — the
    // form decides whether the save actually happened.
    footer.lastChild.addEventListener('click', (event) => event.stopPropagation(), true);

    openDialog({
      title: isEdit ? 'Edit bookmark' : 'Add bookmark',
      width: '560px',
      body: form,
      footer: footer
    });
  }

  /** Scroll to and highlight a bookmark in the current view. */
  function focusBookmark(id) {
    const bookmark = data.bookmarks.find((b) => b.id === id);
    if (!bookmark) return;

    // Make sure the bookmark is reachable in the current view.
    if (bookmark.deleted) {
      setView('trash');
    } else if (bookmark.archived) {
      setView('archive');
    } else if (ui.view === 'category' && ui.categoryId !== bookmark.categoryId) {
      setView('all');
    } else if (ui.view === 'favorites' && !bookmark.favorite) {
      setView('all');
    } else if (ui.view === 'recent' && !isRecent(bookmark)) {
      setView('all');
    }

    ui.query = '';
    $('searchInput').value = '';
    $('clearSearch').hidden = true;
    render();

    const card = document.querySelector('[data-bookmark-id="' + cssEscape(bookmark.id) + '"]');
    if (!card) return;
    card.scrollIntoView({ block: 'center', behavior: 'smooth' });
    card.style.borderColor = 'var(--text)';
    setTimeout(() => { card.style.borderColor = ''; }, 1600);
    const link = card.querySelector('.card-title');
    if (link) link.focus();
  }

  /** Minimal CSS.escape polyfill for attribute selector values. */
  function cssEscape(value) {
    if (window.CSS && typeof window.CSS.escape === 'function') return window.CSS.escape(value);
    return String(value).replace(/[^a-zA-Z0-9_-]/g, function (ch) {
      return '\\' + ch;
    });
  }

  /* =======================================================================
     10. BOOKMARK ACTIONS
     ======================================================================= */

  function setView(view, categoryId) {
    ui.view = view;
    ui.categoryId = (view === 'category') ? (categoryId || null) : null;
    if (view !== 'category') ui.categoryId = null;
    closeDrawer();
    render();
  }

  function toggleFavorite(bookmark) {
    bookmark.favorite = !bookmark.favorite;
    bookmark.updatedAt = nowIso();
    const saved = persist();
    render();
    if (saved) {
      toast(bookmark.favorite ? 'Added to favorites.' : 'Removed from favorites.');
    }
  }

  function setArchived(bookmark, archived) {
    const previous = bookmark.archived;
    bookmark.archived = archived;
    bookmark.updatedAt = nowIso();
    const saved = persist();
    render();
    if (!saved) return;

    if (archived) {
      toast('Bookmark archived.', {
        actionLabel: 'Undo',
        onAction: () => {
          bookmark.archived = previous;
          bookmark.updatedAt = nowIso();
          persist();
          render();
        }
      });
    } else {
      toast('Bookmark restored from archive.');
    }
  }

  function moveToTrash(bookmark) {
    const snapshot = { deleted: bookmark.deleted, deletedAt: bookmark.deletedAt, archived: bookmark.archived };
    bookmark.deleted = true;
    bookmark.deletedAt = nowIso();
    bookmark.updatedAt = nowIso();
    const saved = persist();
    render();
    if (!saved) return;

    toast('Moved to trash.', {
      actionLabel: 'Undo',
      onAction: () => {
        bookmark.deleted = snapshot.deleted;
        bookmark.deletedAt = snapshot.deletedAt;
        bookmark.archived = snapshot.archived;
        bookmark.updatedAt = nowIso();
        persist();
        render();
        toast('Bookmark restored.');
      }
    });
  }

  function restoreFromTrash(bookmark) {
    bookmark.deleted = false;
    bookmark.deletedAt = null;
    bookmark.updatedAt = nowIso();
    const saved = persist();
    render();
    if (saved) toast('Bookmark restored.');
  }

  async function purgeBookmark(bookmark) {
    const ok = await confirmDialog({
      title: 'Delete permanently?',
      message: '“' + truncate(bookmark.title, 70) + '” will be removed from this browser for good. This cannot be undone.',
      confirmLabel: 'Delete permanently'
    });
    if (!ok) return;

    const index = data.bookmarks.findIndex((b) => b.id === bookmark.id);
    if (index === -1) return;
    data.bookmarks.splice(index, 1);
    const saved = persist();
    render();
    if (saved) toast('Bookmark deleted permanently.');
  }

  /* =======================================================================
     11. CATEGORY MANAGEMENT
     ======================================================================= */

  async function createCategory() {
    const name = await promptDialog({
      title: 'New category',
      label: 'Category name',
      maxLength: LIMITS.category,
      confirmLabel: 'Create',
      requiredMessage: 'Enter a category name.'
    });
    if (!name) return;

    const exists = data.categories.some((c) => c.name.toLowerCase() === name.toLowerCase());
    if (exists) {
      toast('A category with that name already exists.', { type: 'error' });
      return;
    }
    if (data.categories.length >= LIMITS.categories) {
      toast('You have reached the maximum number of categories.', { type: 'error' });
      return;
    }

    data.categories.push({ id: uid('cat'), name: name });
    const saved = persist();
    render();
    if (saved) toast('Category “' + name + '” created.');
  }

  async function renameCategory(categoryId) {
    const category = categoryById(categoryId);
    if (!category) return;

    const name = await promptDialog({
      title: 'Rename category',
      label: 'Category name',
      value: category.name,
      maxLength: LIMITS.category,
      confirmLabel: 'Rename',
      requiredMessage: 'Enter a category name.'
    });
    if (!name || name === category.name) return;

    const clash = data.categories.some((c) =>
      c.id !== categoryId && c.name.toLowerCase() === name.toLowerCase());
    if (clash) {
      toast('Another category already uses that name.', { type: 'error' });
      return;
    }

    category.name = name;
    const saved = persist();
    render();
    if (saved) toast('Category renamed.');
  }

  async function deleteCategory(categoryId) {
    const category = categoryById(categoryId);
    if (!category) return;

    const affected = data.bookmarks.filter((b) => b.categoryId === categoryId).length;
    const ok = await confirmDialog({
      title: 'Delete category “' + category.name + '”?',
      message: affected
        ? affected + ' bookmark' + (affected === 1 ? '' : 's') +
          ' will become uncategorized. The bookmarks themselves are not deleted.'
        : 'This category is empty. Deleting it will not remove any bookmarks.',
      confirmLabel: 'Delete category'
    });
    if (!ok) return;

    data.categories = data.categories.filter((c) => c.id !== categoryId);
    for (const bookmark of data.bookmarks) {
      if (bookmark.categoryId === categoryId) {
        bookmark.categoryId = null;
        bookmark.updatedAt = nowIso();
      }
    }

    if (ui.view === 'category' && ui.categoryId === categoryId) {
      ui.view = 'all';
      ui.categoryId = null;
    }

    const saved = persist();
    render();
    if (saved) toast('Category deleted.');
  }

  /* =======================================================================
     12. IMPORT / EXPORT
     ======================================================================= */

  function downloadFile(filename, content, mimeType) {
    const blob = new Blob([content], { type: mimeType || 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const anchor = document.createElement('a');
    anchor.href = url;
    anchor.download = filename;
    anchor.rel = 'noopener';
    document.body.appendChild(anchor);
    anchor.click();
    anchor.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1500);
  }

  function dateStamp() {
    const d = new Date();
    const pad = (n) => String(n).padStart(2, '0');
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }

  function exportJson() {
    const payload = {
      format: EXPORT_FORMAT,
      version: SCHEMA_VERSION,
      exportedAt: nowIso(),
      preferences: {
        theme: data.prefs.theme,
        view: data.prefs.view,
        sort: data.prefs.sort
      },
      categories: data.categories.map((c) => ({ id: c.id, name: c.name })),
      bookmarks: data.bookmarks.map((b) => ({
        id: b.id,
        url: b.url,
        title: b.title,
        description: b.description,
        categoryId: b.categoryId,
        category: categoryName(b.categoryId) || null,
        tags: b.tags.slice(),
        favorite: b.favorite,
        archived: b.archived,
        deleted: b.deleted,
        deletedAt: b.deletedAt,
        createdAt: b.createdAt,
        updatedAt: b.updatedAt
      }))
    };

    downloadFile('bookmarks-' + dateStamp() + '.json', JSON.stringify(payload, null, 2), 'application/json');
    toast('Exported ' + data.bookmarks.length + ' bookmark' + (data.bookmarks.length === 1 ? '' : 's') + ' as JSON.');
  }

  function csvCell(value) {
    const text = value === null || value === undefined ? '' : String(value);
    return /[",\r\n]/.test(text) ? '"' + text.replace(/"/g, '""') + '"' : text;
  }

  function exportCsv() {
    const header = ['title', 'url', 'description', 'category', 'tags', 'favorite', 'archived', 'createdAt'];
    const rows = [header];

    for (const bookmark of data.bookmarks) {
      rows.push([
        bookmark.title,
        bookmark.url,
        bookmark.description,
        categoryName(bookmark.categoryId),
        bookmark.tags.join('; '),
        bookmark.favorite ? 'true' : 'false',
        bookmark.archived ? 'true' : 'false',
        bookmark.createdAt
      ]);
    }

    const csv = '\ufeff' + rows.map((row) => row.map(csvCell).join(',')).join('\r\n');
    downloadFile('bookmarks-' + dateStamp() + '.csv', csv, 'text/csv;charset=utf-8');
    toast('Exported ' + data.bookmarks.length + ' bookmark' + (data.bookmarks.length === 1 ? '' : 's') + ' as CSV.');
  }

  /**
   * Validate a parsed import payload into a candidate collection.
   * Returns null when the payload is unusable, or
   * { bookmarks, categories, skipped, duplicatesInFile }.
   */
  function buildImportCandidate(parsed) {
    if (!parsed || typeof parsed !== 'object' || Array.isArray(parsed)) return null;
    if (!Array.isArray(parsed.bookmarks)) return null;

    if (parsed.bookmarks.length > LIMITS.importRecords) {
      return { error: 'That file contains more than ' + LIMITS.importRecords + ' bookmarks.' };
    }

    // Reuse the same sanitiser used for local storage.
    const holder = { categories: [] };
    const state = sanitizeState({
      categories: parsed.categories,
      bookmarks: parsed.bookmarks
    });

    holder.categories = state.categories;

    return {
      bookmarks: state.bookmarks,
      categories: state.categories,
      total: parsed.bookmarks.length,
      skipped: parsed.bookmarks.length - state.bookmarks.length
    };
  }

  function handleImportFile(file) {
    if (!file) return;

    if (file.size > LIMITS.importBytes) {
      toast('That file is too large. The limit is 5 MB.', { type: 'error' });
      return;
    }

    const reader = new FileReader();

    reader.onerror = () => {
      toast('The file could not be read.', { type: 'error' });
    };

    reader.onload = () => {
      const text = typeof reader.result === 'string' ? reader.result : '';
      let parsed;
      try {
        parsed = JSON.parse(text);
      } catch (err) {
        toast('That file is not valid JSON.', { type: 'error' });
        return;
      }

      const candidate = buildImportCandidate(parsed);
      if (!candidate) {
        toast('That file is not a Bookmark Manager export.', { type: 'error' });
        return;
      }
      if (candidate.error) {
        toast(candidate.error, { type: 'error' });
        return;
      }
      if (!candidate.bookmarks.length) {
        toast('No valid bookmarks were found in that file.', { type: 'error' });
        return;
      }

      openImportPreview(candidate);
    };

    reader.readAsText(file);
  }

  function openImportPreview(candidate) {
    const existingUrls = new Set(
      data.bookmarks.filter((b) => !b.deleted).map((b) => b.url.toLowerCase())
    );

    const fresh = [];
    let duplicates = 0;
    for (const bookmark of candidate.bookmarks) {
      if (existingUrls.has(bookmark.url.toLowerCase())) duplicates += 1;
      else fresh.push(bookmark);
    }

    const body = el('div');

    const summary = el('dl', 'stats');
    const addStat = (label, value) => {
      const wrap = el('div');
      wrap.appendChild(el('dt', null, label));
      wrap.appendChild(el('dd', null, String(value)));
      summary.appendChild(wrap);
    };
    addStat('In file', candidate.total);
    addStat('New', fresh.length);
    addStat('Already saved', duplicates);
    addStat('Skipped (invalid)', candidate.skipped);
    body.appendChild(summary);

    body.appendChild(el('p', 'settings-note',
      'Only http:// and https:// links are accepted. Nothing is written until you choose an option below.'));

    /* mode selection */
    const modeWrap = el('div', 'field');
    const legend = el('label', null, 'How should this be applied?');
    modeWrap.appendChild(legend);

    const mergeLabel = el('label', 'checkbox');
    const mergeRadio = el('input');
    mergeRadio.type = 'radio';
    mergeRadio.name = 'import-mode';
    mergeRadio.value = 'merge';
    mergeRadio.checked = true;
    mergeLabel.append(mergeRadio, el('span', null, 'Merge — keep my bookmarks and add the new ones'));

    const replaceLabel = el('label', 'checkbox');
    const replaceRadio = el('input');
    replaceRadio.type = 'radio';
    replaceRadio.name = 'import-mode';
    replaceRadio.value = 'replace';
    replaceLabel.append(replaceRadio,
      el('span', null, 'Replace — delete everything here and use only this file'));

    modeWrap.append(mergeLabel, replaceLabel);
    body.appendChild(modeWrap);

    let confirmed = false;

    const footer = buildDialogFooter([
      { label: 'Cancel', onClick: () => true },
      {
        label: 'Import',
        variant: 'primary',
        onClick: () => {
          if (confirmed) return true;

          const mode = replaceRadio.checked ? 'replace' : 'merge';

          const run = () => {
            confirmed = true;
            const result = applyImport(candidate, mode, fresh);
            toast('Imported ' + result.added + ' bookmark' + (result.added === 1 ? '' : 's') +
                  (result.skipped ? ', skipped ' + result.skipped : '') + '.');
            render();
            closeDialog();
          };

          if (mode === 'replace') {
            confirmDialog({
              title: 'Replace all bookmarks?',
              message: 'Your current ' + data.bookmarks.length +
                       ' bookmark(s) and categories will be permanently replaced by the contents of this file.',
              confirmLabel: 'Replace everything'
            }).then((ok) => {
              if (!ok) return;
              run();
            });
            return false; // keep this dialog open until the confirmation resolves
          }

          run();
          return true;
        }
      }
    ]);

    openDialog({
      title: 'Import bookmarks',
      width: '560px',
      body: body,
      footer: footer
    });
  }

  function applyImport(candidate, mode, fresh) {
    let added = 0;
    let skipped = candidate.skipped;

    if (mode === 'replace') {
      // Rebuild categories with collision-safe ids, remapping bookmarks.
      const idMap = new Map();
      const categories = [];
      for (const category of candidate.categories) {
        let id = category.id;
        if (categories.some((c) => c.id === id)) id = uid('cat');
        idMap.set(category.id, id);
        categories.push({ id: id, name: category.name });
      }

      const usedIds = new Set();
      const bookmarks = candidate.bookmarks.map((bookmark) => {
        let id = bookmark.id;
        if (usedIds.has(id)) id = uid('bm');
        usedIds.add(id);
        return Object.assign({}, bookmark, {
          id: id,
          categoryId: bookmark.categoryId ? (idMap.get(bookmark.categoryId) || null) : null
        });
      });

      data.categories = categories;
      data.bookmarks = bookmarks;
      added = bookmarks.length;
      persist();
      return { added: added, skipped: skipped };
    }

    // Merge mode
    const categoryMap = new Map();
    for (const category of candidate.categories) {
      const existing = data.categories.find(
        (c) => c.name.toLowerCase() === category.name.toLowerCase());
      if (existing) {
        categoryMap.set(category.id, existing.id);
      } else {
        const id = data.categories.some((c) => c.id === category.id) ? uid('cat') : category.id;
        data.categories.push({ id: id, name: category.name });
        categoryMap.set(category.id, id);
      }
    }

    const usedIds = new Set(data.bookmarks.map((b) => b.id));
    for (const bookmark of fresh) {
      let id = bookmark.id;
      if (usedIds.has(id)) id = uid('bm');
      usedIds.add(id);
      data.bookmarks.push(Object.assign({}, bookmark, {
        id: id,
        categoryId: bookmark.categoryId ? (categoryMap.get(bookmark.categoryId) || null) : null
      }));
      added += 1;
    }

    persist();
    return { added: added, skipped: skipped };
  }

  /* ------------------------------ Sample data ------------------------------ */

  function loadSampleData() {
    const samples = [
      ['https://developer.mozilla.org/en-US/docs/Web/JavaScript', 'MDN JavaScript reference', 'Development', ['reference', 'javascript'], true],
      ['https://github.com', 'GitHub', 'Development', ['code', 'git'], false],
      ['https://www.figma.com', 'Figma', 'Design', ['design', 'tools'], true],
      ['https://css-tricks.com', 'CSS-Tricks', 'Design', ['css', 'frontend'], false],
      ['https://news.ycombinator.com', 'Hacker News', 'Research', ['news', 'tech'], false],
      ['https://www.smashingmagazine.com', 'Smashing Magazine', 'Design', ['design', 'reading'], false],
      ['https://web.dev', 'web.dev', 'Development', ['performance', 'web'], false],
      ['https://www.notion.so', 'Notion', 'Productivity', ['notes', 'tools'], true],
      ['https://todoist.com', 'Todoist', 'Productivity', ['tasks'], false],
      ['https://www.coursera.org', 'Coursera', 'Learning', ['courses'], false],
      ['https://archive.org', 'Internet Archive', 'Research', ['archive'], false],
      ['https://www.youtube.com', 'YouTube', 'Entertainment', ['video'], false]
    ];

    const stamp = Date.now();
    let created = 0;

    samples.forEach((entry, index) => {
      const url = normalizeUrl(entry[0]);
      if (!url) return;
      if (data.bookmarks.some((b) => b.url.toLowerCase() === url.toLowerCase())) return;

      const categoryId = findOrCreateCategory(entry[2], data.categories);
      const createdIso = new Date(stamp - index * 86400000).toISOString();

      data.bookmarks.push({
        id: uid('bm'),
        url: url,
        title: entry[1],
        description: '',
        categoryId: categoryId,
        tags: sanitizeTags(entry[3]),
        favorite: entry[4],
        archived: false,
        deleted: false,
        deletedAt: null,
        createdAt: createdIso,
        updatedAt: createdIso
      });
      created += 1;
    });

    if (!created) {
      toast('Sample bookmarks are already in your collection.');
      return;
    }

    persist();
    render();
    toast('Added ' + created + ' sample bookmark' + (created === 1 ? '' : 's') + '.');
  }

  async function resetEverything() {
    const ok = await confirmDialog({
      title: 'Delete all data?',
      message: 'Every bookmark, category and preference stored in this browser will be removed. ' +
               'Export a backup first if you might want them back.',
      confirmLabel: 'Delete everything'
    });
    if (!ok) return;

    data = defaultState();
    saveBlocked = false;
    rawBackup = null;
    recoveryReason = '';
    lastSavedJson = null;

    try {
      window.localStorage.removeItem(STORAGE_KEY);
    } catch (err) {
      // Ignore: the in-memory reset below still runs.
    }

    ui.view = 'all';
    ui.categoryId = null;
    ui.query = '';
    ui.tag = null;
    $('searchInput').value = '';
    $('clearSearch').hidden = true;

    applyTheme();
    persist();
    render();
    toast('All local data has been deleted.');
  }

  /* =======================================================================
     13. SETTINGS DIALOG
     ======================================================================= */

  function openSettings() {
    const body = el('div');

    /* --- Appearance --- */
    const appearance = el('section', 'settings-section');
    appearance.appendChild(el('h3', 'settings-title', 'Appearance'));

    const themeSeg = el('div', 'seg seg--text');
    themeSeg.setAttribute('role', 'group');
    themeSeg.setAttribute('aria-label', 'Theme preference');

    const themeButtons = [];
    [['light', 'Light'], ['dark', 'Dark'], ['system', 'System']].forEach((pair) => {
      const btn = el('button', null, pair[1]);
      btn.type = 'button';
      btn.dataset.themeChoice = pair[0];
      btn.addEventListener('click', () => {
        setTheme(pair[0]);
        syncThemeSegment();
      });
      themeButtons.push(btn);
      themeSeg.appendChild(btn);
    });

    function syncThemeSegment() {
      themeButtons.forEach((btn) => {
        btn.setAttribute('aria-pressed', String(btn.dataset.themeChoice === data.prefs.theme));
      });
    }
    syncThemeSegment();

    appearance.appendChild(themeSeg);
    appearance.appendChild(el('p', 'settings-note',
      '“System” follows your operating system colour scheme. The choice is remembered in this browser.'));
    body.appendChild(appearance);

    /* --- Default layout --- */
    const layout = el('section', 'settings-section');
    layout.appendChild(el('h3', 'settings-title', 'Default layout'));

    const layoutSeg = el('div', 'seg seg--text');
    layoutSeg.setAttribute('role', 'group');
    layoutSeg.setAttribute('aria-label', 'Default layout');

    [['grid', 'Grid'], ['list', 'List']].forEach((pair) => {
      const btn = el('button', null, pair[1]);
      btn.type = 'button';
      btn.addEventListener('click', () => {
        data.prefs.view = pair[0];
        persist();
        layoutSeg.querySelectorAll('button').forEach((node) => {
          node.setAttribute('aria-pressed', String(node.textContent.toLowerCase() === data.prefs.view));
        });
        render();
      });
      btn.setAttribute('aria-pressed', String(data.prefs.view === pair[0]));
      layoutSeg.appendChild(btn);
    });

    layout.appendChild(layoutSeg);
    body.appendChild(layout);

    /* --- Data --- */
    const dataSection = el('section', 'settings-section');
    dataSection.appendChild(el('h3', 'settings-title', 'Your data'));

    const dataButtons = el('div', 'btn-row');

    const exportJsonBtn = el('button', 'btn btn--sm', 'Export JSON');
    exportJsonBtn.type = 'button';
    exportJsonBtn.addEventListener('click', exportJson);

    const exportCsvBtn = el('button', 'btn btn--sm', 'Export CSV');
    exportCsvBtn.type = 'button';
    exportCsvBtn.addEventListener('click', exportCsv);

    const importBtn = el('button', 'btn btn--sm btn--primary', 'Import JSON…');
    importBtn.type = 'button';
    importBtn.addEventListener('click', () => fileInput.click());

    dataButtons.append(exportJsonBtn, exportCsvBtn, importBtn);
    dataSection.appendChild(dataButtons);

    const fileInput = el('input');
    fileInput.type = 'file';
    fileInput.accept = 'application/json,.json';
    fileInput.hidden = true;
    fileInput.addEventListener('change', () => {
      const file = fileInput.files && fileInput.files[0];
      fileInput.value = '';
      handleImportFile(file);
    });
    dataSection.appendChild(fileInput);

    const dropzone = el('div', 'dropzone', 'Drop a JSON export here, or use the button above.');
    dataSection.appendChild(dropzone);

    ['dragenter', 'dragover'].forEach((type) => {
      dropzone.addEventListener(type, (event) => {
        event.preventDefault();
        dropzone.classList.add('is-over');
      });
    });
    ['dragleave', 'drop'].forEach((type) => {
      dropzone.addEventListener(type, (event) => {
        event.preventDefault();
        dropzone.classList.remove('is-over');
      });
    });
    dropzone.addEventListener('drop', (event) => {
      const files = event.dataTransfer && event.dataTransfer.files;
      if (files && files.length) handleImportFile(files[0]);
    });

    dataSection.appendChild(el('p', 'settings-note',
      'Everything lives in this browser’s localStorage. It is not encrypted, not synced, ' +
      'and it disappears if you clear site data or switch browser or device. Export regularly.'));

    body.appendChild(dataSection);

    /* --- Statistics --- */
    const statsSection = el('section', 'settings-section');
    statsSection.appendChild(el('h3', 'settings-title', 'Statistics'));

    const { counts } = computeCounts();
    const tagSet = new Set();
    for (const bookmark of data.bookmarks) {
      for (const tag of bookmark.tags) tagSet.add(tag);
    }

    const stats = el('dl', 'stats');
    const addStat = (label, value) => {
      const wrap = el('div');
      wrap.appendChild(el('dt', null, label));
      wrap.appendChild(el('dd', null, String(value)));
      stats.appendChild(wrap);
    };
    addStat('Bookmarks', counts.all);
    addStat('Favorites', counts.favorites);
    addStat('Archived', counts.archive);
    addStat('In trash', counts.trash);
    addStat('Categories', data.categories.length);
    addStat('Unique tags', tagSet.size);

    statsSection.appendChild(stats);
    body.appendChild(statsSection);

    /* --- Keyboard shortcuts --- */
    const shortcuts = el('section', 'settings-section');
    shortcuts.appendChild(el('h3', 'settings-title', 'Keyboard shortcuts'));

    const kbdList = el('div', 'kbd-list');
    const addShortcut = (key, description) => {
      kbdList.appendChild(el('kbd', null, key));
      kbdList.appendChild(el('span', null, description));
    };
    addShortcut('/', 'Focus the search field');
    addShortcut('n', 'Add a new bookmark');
    addShortcut('Esc', 'Close dialogs, drawers, or clear search');
    addShortcut('Tab', 'Move between controls');
    shortcuts.appendChild(kbdList);
    body.appendChild(shortcuts);

    /* --- Danger zone --- */
    const danger = el('section', 'settings-section');
    danger.appendChild(el('h3', 'settings-title', 'Danger zone'));

    const dangerRow = el('div', 'btn-row');

    const demoBtn = el('button', 'btn btn--sm', 'Load sample data');
    demoBtn.type = 'button';
    demoBtn.addEventListener('click', () => {
      loadSampleData();
      closeDialog();
    });

    const resetBtn = el('button', 'btn btn--sm', 'Delete all data');
    resetBtn.type = 'button';
    resetBtn.addEventListener('click', () => {
      closeDialog();
      resetEverything();
    });

    dangerRow.append(demoBtn, resetBtn);
    danger.appendChild(dangerRow);
    body.appendChild(danger);

    openDialog({
      title: 'Settings',
      width: '620px',
      body: body,
      footer: buildDialogFooter([{ label: 'Done', variant: 'primary', onClick: () => true }])
    });
  }

  /* =======================================================================
     14. THEME
     ======================================================================= */

  const mediaQuery = window.matchMedia('(prefers-color-scheme: dark)');

  function resolveTheme() {
    const pref = data.prefs.theme;
    if (pref === 'light' || pref === 'dark') return pref;
    return mediaQuery.matches ? 'dark' : 'light';
  }

  function applyTheme() {
    document.documentElement.setAttribute('data-theme', resolveTheme());
  }

  function setTheme(preference) {
    if (THEME_OPTIONS.indexOf(preference) === -1) return;
    data.prefs.theme = preference;
    applyTheme();
    persist();
    renderThemeButton();
  }

  function toggleTheme() {
    const current = resolveTheme();
    setTheme(current === 'dark' ? 'light' : 'dark');
  }

  if (typeof mediaQuery.addEventListener === 'function') {
    mediaQuery.addEventListener('change', () => {
      if (data.prefs.theme === 'system') {
        applyTheme();
        renderThemeButton();
      }
    });
  }

  /* =======================================================================
     15. DRAWER (mobile navigation)
     ======================================================================= */

  function openDrawer() {
    ui.drawerOpen = true;
    $('sidebar').classList.add('is-open');
    $('scrim').hidden = false;
    // Force a reflow so the transition runs when unhiding the scrim.
    void $('scrim').offsetWidth;
    $('scrim').classList.add('is-open');
    $('menuBtn').setAttribute('aria-expanded', 'true');
  }

  function closeDrawer() {
    if (!ui.drawerOpen) return;
    ui.drawerOpen = false;
    $('sidebar').classList.remove('is-open');
    $('scrim').classList.remove('is-open');
    $('menuBtn').setAttribute('aria-expanded', 'false');
    setTimeout(() => {
      if (!ui.drawerOpen) $('scrim').hidden = true;
    }, 220);
  }

  /* =======================================================================
     16. EVENT WIRING
     ======================================================================= */

  function onSidebarClick(event) {
    const navItem = event.target.closest('.nav-item');
    if (!navItem) return;

    const view = navItem.dataset.view;
    if (!view) return;

    if (view === 'category') {
      setView('category', navItem.dataset.categoryId);
    } else {
      setView(view);
    }
  }

  function onSearchInput(event) {
    ui.query = event.target.value;
    $('clearSearch').hidden = !ui.query;
    renderList();
    renderActiveFilters();
  }

  function clearSearch() {
    ui.query = '';
    $('searchInput').value = '';
    $('clearSearch').hidden = true;
    renderList();
    renderActiveFilters();
    $('searchInput').focus();
  }

  function setTagFilter(tag) {
    if (!tag) {
      ui.tag = null;
    } else {
      ui.tag = (ui.tag === tag) ? null : tag;
    }
    renderActiveFilters();
    renderList();
  }

  function onContentClick(event) {
    const actionEl = event.target.closest('[data-action]');
    if (!actionEl) return;

    const action = actionEl.dataset.action;
    const card = actionEl.closest('[data-bookmark-id]');
    const id = card ? card.dataset.bookmarkId : null;
    const bookmark = id ? data.bookmarks.find((b) => b.id === id) : null;

    switch (action) {
      case 'favorite':
        if (bookmark) toggleFavorite(bookmark);
        break;
      case 'edit':
        if (bookmark) openBookmarkForm(bookmark);
        break;
      case 'archive':
        if (bookmark) setArchived(bookmark, true);
        break;
      case 'unarchive':
        if (bookmark) setArchived(bookmark, false);
        break;
      case 'trash':
        if (bookmark) moveToTrash(bookmark);
        break;
      case 'restore':
        if (bookmark) restoreFromTrash(bookmark);
        break;
      case 'purge':
        if (bookmark) purgeBookmark(bookmark);
        break;
      case 'filter-tag':
        setTagFilter(actionEl.dataset.tag || null);
        break;
      case 'filter-category':
        setView('category', actionEl.dataset.categoryId || null);
        break;
      case 'clear-tag':
        setTagFilter(null);
        break;
      case 'clear-filters':
        ui.tag = null;
        clearSearch();
        break;
      case 'add':
        openBookmarkForm(null);
        break;
      case 'demo':
        loadSampleData();
        break;
      default:
        break;
    }
  }

  function onGlobalKeydown(event) {
    // Never hijack shortcuts while the user is typing.
    if (isTypingTarget(event.target)) {
      if (event.key === 'Escape' && event.target === $('searchInput') && ui.query) {
        clearSearch();
      }
      return;
    }

    if (dialog) return;

    if (event.key === '/' && !event.ctrlKey && !event.metaKey && !event.altKey) {
      event.preventDefault();
      $('searchInput').focus();
      $('searchInput').select();
      return;
    }

    if ((event.key === 'n' || event.key === 'N') && !event.ctrlKey && !event.metaKey && !event.altKey) {
      event.preventDefault();
      openBookmarkForm(null);
      return;
    }

    if (event.key === 'Escape') {
      if (ui.drawerOpen) {
        closeDrawer();
        return;
      }
      if (ui.tag) {
        setTagFilter(null);
        return;
      }
      if (ui.query) clearSearch();
    }
  }

  function wireEvents() {
    $('addBtn').addEventListener('click', () => openBookmarkForm(null));
    $('menuBtn').addEventListener('click', () => {
      if (ui.drawerOpen) closeDrawer(); else openDrawer();
    });
    $('scrim').addEventListener('click', closeDrawer);
    $('sidebar').addEventListener('click', onSidebarClick);
    $('addCategoryBtn').addEventListener('click', createCategory);
    $('settingsBtn').addEventListener('click', openSettings);
    $('themeToggle').addEventListener('click', toggleTheme);

    $('searchInput').addEventListener('input', onSearchInput);
    $('clearSearch').addEventListener('click', clearSearch);

    $('sortSelect').addEventListener('change', (event) => {
      const value = event.target.value;
      if (SORT_OPTIONS.indexOf(value) === -1) return;
      data.prefs.sort = value;
      persist();
      renderList();
    });

    $('viewToggle').addEventListener('click', (event) => {
      const btn = event.target.closest('[data-viewmode]');
      if (!btn) return;
      const mode = btn.dataset.viewmode;
      if (VIEW_MODES.indexOf(mode) === -1) return;
      data.prefs.view = mode;
      persist();
      render();
    });

    $('content').addEventListener('click', onContentClick);

    $('modalBackdrop').addEventListener('mousedown', () => {
      if (dialog && dialog.dismissible) closeDialog();
    });

    document.addEventListener('keydown', onGlobalKeydown);

    // Close the mobile drawer when the viewport grows past the breakpoint.
    window.addEventListener('resize', () => {
      if (window.innerWidth > 900 && ui.drawerOpen) closeDrawer();
    });

    // Re-evaluate "recent" as time passes without a page reload.
    window.setInterval(() => {
      if (document.hidden) return;
      if (ui.view === 'recent') {
        renderSidebar();
        renderList();
      }
    }, 60000);
  }

  /* =======================================================================
     17. BOOTSTRAP
     ======================================================================= */

  function init() {
    loadApp();
    applyTheme();
    wireEvents();
    render();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init, { once: true });
  } else {
    init();
  }
})();
</script>
