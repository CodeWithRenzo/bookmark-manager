<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Bookmark Manager</title>
<meta name="description" content="A fast, private, single-file bookmark manager. Everything is stored locally in your browser.">

<!--
  Theme bootstrap: runs before the body paints so the correct theme is applied
  on the very first frame (prevents the "flash of wrong theme").
  It reads only the persisted preference; any failure falls back to light.
-->
<script>
(function () {
  try {
    var raw = localStorage.getItem('bookmark-manager.state.v1');
    var pref = 'system';
    if (raw) {
      var parsed = JSON.parse(raw);
      if (parsed && parsed.prefs && typeof parsed.prefs.theme === 'string') {
        pref = parsed.prefs.theme;
      }
    }
    var resolved = (pref === 'light' || pref === 'dark')
      ? pref
      : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', resolved);
  } catch (err) {
    document.documentElement.setAttribute('data-theme', 'light');
  }
})();
</script>

<style>
/* =========================================================================
   1. DESIGN TOKENS
   ========================================================================= */
:root {
  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;

  --r-sm: 6px;
  --r-md: 9px;
  --r-lg: 14px;
  --r-full: 999px;
}

:root[data-theme="light"] {
  color-scheme: light;
  --bg: #fbfbfc;
  --sidebar-bg: #f5f5f7;
  --surface: #ffffff;
  --surface-2: #f4f4f6;
  --surface-hover: #ededf0;
  --border: #e5e5e9;
  --border-strong: #d2d2d9;
  --text: #111114;
  --text-2: #5a5a63;
  --text-3: #8b8b95;
  --invert-bg: #111114;
  --invert-fg: #ffffff;
  --focus-ring: #111114;
  --shadow-sm: 0 1px 2px rgba(17, 17, 20, .05);
  --shadow-md: 0 2px 4px rgba(17, 17, 20, .05), 0 16px 34px rgba(17, 17, 20, .10);
  --overlay: rgba(17, 17, 20, .42);
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0a0a0b;
  --sidebar-bg: #0e0e10;
  --surface: #131315;
  --surface-2: #1a1a1d;
  --surface-hover: #1f1f23;
  --border: #26262b;
  --border-strong: #3a3a42;
  --text: #f3f3f5;
  --text-2: #a5a5b0;
  --text-3: #77777f;
  --invert-bg: #f3f3f5;
  --invert-fg: #0a0a0b;
  --focus-ring: #f3f3f5;
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, .45);
  --shadow-md: 0 2px 4px rgba(0, 0, 0, .45), 0 16px 34px rgba(0, 0, 0, .55);
  --overlay: rgba(0, 0, 0, .64);
}

/* =========================================================================
   2. RESET & BASE
   ========================================================================= */
*, *::before, *::after { box-sizing: border-box; }

html, body { height: 100%; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-sans);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
}

body.is-locked { overflow: hidden; }

h1, h2, h3, h4, p, dl, dd, dt { margin: 0; }

button, input, select, textarea { font: inherit; color: inherit; }

a { color: inherit; }

:where(button, a, input, select, textarea, [tabindex]):focus-visible {
  outline: 2px solid var(--focus-ring);
  outline-offset: 2px;
}

.sr-only {
  position: absolute;
  width: 1px; height: 1px;
  padding: 0; margin: -1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
  border: 0;
}

.icon-sprite { position: absolute; width: 0; height: 0; overflow: hidden; }

.icon {
  width: 16px; height: 16px;
  flex: none;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.6;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.icon--sm { width: 14px; height: 14px; }

/* =========================================================================
   3. BUTTONS & CONTROLS
   ========================================================================= */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  height: 34px;
  padding: 0 12px;
  border: 1px solid var(--border-strong);
  border-radius: var(--r-sm);
  background: var(--surface);
  color: var(--text);
  font-size: 13px;
  font-weight: 500;
  line-height: 1;
  white-space: nowrap;
  cursor: pointer;
  transition: background-color .14s ease, border-color .14s ease, opacity .14s ease;
}
.btn:hover { background: var(--surface-hover); }
.btn:active { transform: translateY(.5px); }
.btn:disabled { opacity: .45; cursor: not-allowed; }

.btn--primary {
  background: var(--invert-bg);
  border-color: var(--invert-bg);
  color: var(--invert-fg);
}
.btn--primary:hover { background: var(--invert-bg); opacity: .87; }

.btn--ghost { background: transparent; border-color: transparent; color: var(--text-2); }
.btn--ghost:hover { background: var(--surface-hover); color: var(--text); }

.btn--sm { height: 28px; padding: 0 9px; font-size: 12px; }

.icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 30px; height: 30px;
  padding: 0;
  border: 1px solid transparent;
  border-radius: var(--r-sm);
  background: transparent;
  color: var(--text-2);
  cursor: pointer;
  transition: background-color .14s ease, color .14s ease, opacity .14s ease;
}
.icon-btn:hover { background: var(--surface-hover); color: var(--text); }
.icon-btn[aria-pressed="true"] { color: var(--text); }

/* =========================================================================
   4. APPLICATION SHELL
   ========================================================================= */
.app {
  display: grid;
  grid-template-columns: 264px minmax(0, 1fr);
  min-height: 100vh;
  min-height: 100dvh;
}

/* ---------- Sidebar ---------- */
.sidebar {
  position: sticky;
  top: 0;
  align-self: start;
  height: 100vh;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: 14px 10px;
  background: var(--sidebar-bg);
  border-right: 1px solid var(--border);
  overflow-y: auto;
  overscroll-behavior: contain;
  z-index: 60;
}

.brand {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 4px 8px 16px;
}
.brand svg { width: 21px; height: 21px; flex: none; }
.brand-name { font-size: 13.5px; font-weight: 650; letter-spacing: -.01em; }
.brand-name span { font-weight: 500; color: var(--text-3); }

.nav { display: flex; flex-direction: column; gap: 1px; }

.nav-item {
  display: flex;
  align-items: center;
  gap: 9px;
  width: 100%;
  padding: 7px 9px;
  border: 0;
  border-radius: var(--r-sm);
  background: transparent;
  color: var(--text-2);
  font-size: 13px;
  font-weight: 500;
  text-align: left;
  cursor: pointer;
  transition: background-color .12s ease, color .12s ease;
}
.nav-item:hover { background: var(--surface-hover); color: var(--text); }
.nav-item[aria-current="page"] {
  background: var(--surface);
  color: var(--text);
  box-shadow: inset 0 0 0 1px var(--border);
}
.nav-item .icon { color: var(--text-3); }
.nav-item[aria-current="page"] .icon { color: var(--text); }

.nav-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.nav-count {
  font-size: 11px;
  font-variant-numeric: tabular-nums;
  color: var(--text-3);
  font-weight: 500;
}

.side-section { margin-top: 16px; }
.side-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 9px 4px;
}
.side-head h2 {
  font-size: 10.5px;
  font-weight: 650;
  letter-spacing: .075em;
  text-transform: uppercase;
  color: var(--text-3);
}

.nav-empty {
  padding: 3px 9px;
  font-size: 12px;
  color: var(--text-3);
}

.side-foot {
  margin-top: auto;
  padding-top: 14px;
  display: flex;
  gap: 4px;
}
.side-foot .btn { flex: 1; justify-content: flex-start; }

/* ---------- Mobile scrim ---------- */
.scrim {
  position: fixed;
  inset: 0;
  z-index: 55;
  background: var(--overlay);
  opacity: 0;
  pointer-events: none;
  transition: opacity .18s ease;
}
.scrim.is-open { opacity: 1; pointer-events: auto; }

/* ---------- Main ---------- */
.main {
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 14px;
  padding: 22px 28px 72px;
}

.topbar { display: flex; align-items: flex-start; gap: 12px; }
.topbar-text { min-width: 0; }
.topbar h1 {
  font-size: 21px;
  font-weight: 650;
  letter-spacing: -.022em;
  line-height: 1.25;
  overflow-wrap: anywhere;
}
.topbar p { margin-top: 3px; font-size: 13px; color: var(--text-2); }
.topbar-actions {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 8px;
  flex: none;
}

.menu-btn { display: none; }

/* ---------- Toolbar ---------- */
.toolbar {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}

.search { position: relative; flex: 1 1 280px; min-width: 170px; }
.search > .icon {
  position: absolute;
  left: 10px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-3);
  pointer-events: none;
}
.search input {
  width: 100%;
  height: 36px;
  padding: 0 34px 0 32px;
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  background: var(--surface);
  color: var(--text);
  font-size: 13px;
  transition: border-color .14s ease;
}
.search input::placeholder { color: var(--text-3); }
.search input:focus { border-color: var(--border-strong); outline: none; }
.search input:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 1px; }
.search input::-webkit-search-cancel-button { display: none; }

.search-clear {
  position: absolute;
  right: 4px;
  top: 50%;
  transform: translateY(-50%);
  width: 26px; height: 26px;
}

.toolbar-right { display: flex; align-items: center; gap: 8px; }

.select-wrap { position: relative; display: inline-flex; }
.select-wrap .icon {
  position: absolute;
  right: 8px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-3);
  pointer-events: none;
}
.select-wrap select {
  height: 36px;
  padding: 0 28px 0 10px;
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  background: var(--surface);
  color: var(--text);
  font-size: 13px;
  appearance: none;
  -webkit-appearance: none;
  cursor: pointer;
}

.seg {
  display: inline-flex;
  gap: 2px;
  padding: 2px;
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  background: var(--surface);
}
.seg button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 30px; height: 28px;
  padding: 0;
  border: 0;
  border-radius: 4px;
  background: transparent;
  color: var(--text-3);
  cursor: pointer;
  transition: background-color .12s ease, color .12s ease;
}
.seg button:hover { color: var(--text); }
.seg button[aria-pressed="true"] {
  background: var(--surface-hover);
  color: var(--text);
}
.seg--text button { width: auto; padding: 0 10px; font-size: 12px; font-weight: 500; }

/* ---------- Banners & meta ---------- */
.banner {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 11px 13px;
  border: 1px solid var(--border-strong);
  border-radius: var(--r-sm);
  background: var(--surface-2);
}
.banner > .icon { margin-top: 1px; }
.banner-body { flex: 1; min-width: 0; }
.banner-title { font-size: 13px; font-weight: 600; }
.banner-text { margin-top: 2px; font-size: 12.5px; color: var(--text-2); }
.banner-actions { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }

.list-head {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  min-height: 22px;
}
.list-count { font-size: 12px; color: var(--text-3); font-variant-numeric: tabular-nums; }

.active-filters { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }

/* =========================================================================
   5. BOOKMARK COLLECTION
   ========================================================================= */
.bookmark-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 12px;
}

.bookmark-list { display: flex; flex-direction: column; gap: 6px; }

.card {
  display: flex;
  flex-direction: column;
  gap: 9px;
  padding: 13px 13px 8px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  transition: border-color .14s ease, box-shadow .14s ease;
}
.card:hover { border-color: var(--border-strong); box-shadow: var(--shadow-sm); }
.card:focus-within { border-color: var(--border-strong); }

.card-main { display: flex; gap: 10px; align-items: flex-start; min-width: 0; flex: 1; }

.site-mark {
  flex: none;
  display: grid;
  place-items: center;
  width: 30px; height: 30px;
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  background: var(--surface-2);
  color: var(--text-2);
  font-family: var(--font-mono);
  font-size: 12.5px;
  font-weight: 600;
  text-transform: uppercase;
  user-select: none;
}

.card-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }

.card-title-row { display: flex; flex-direction: column; gap: 1px; min-width: 0; }

.card-title {
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  font-size: 13.5px;
  font-weight: 600;
  line-height: 1.35;
  color: var(--text);
  text-decoration: none;
  overflow-wrap: anywhere;
}
.card-title:hover { text-decoration: underline; text-underline-offset: 2px; }

.card-host {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-3);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.card-desc {
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  margin-top: 3px;
  font-size: 12.5px;
  line-height: 1.45;
  color: var(--text-2);
  overflow-wrap: anywhere;
}

.card-chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }

.chip {
  display: inline-flex;
  align-items: center;
  max-width: 170px;
  height: 20px;
  padding: 0 7px;
  border: 1px solid var(--border);
  border-radius: var(--r-full);
  background: transparent;
  color: var(--text-2);
  font-size: 11px;
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
button.chip { cursor: pointer; transition: background-color .12s ease, color .12s ease, border-color .12s ease; }
button.chip:hover { background: var(--surface-hover); color: var(--text); border-color: var(--border-strong); }
.chip--cat { background: var(--surface-2); }

.card-actions { display: flex; justify-content: flex-end; gap: 1px; }
.card-actions .icon-btn { width: 27px; height: 27px; }
.star-btn[aria-pressed="true"] .icon { fill: currentColor; }

@media (hover: hover) and (pointer: fine) {
  .card-action:not(.star-btn) { opacity: 0; }
  .card:hover .card-action,
  .card:focus-within .card-action { opacity: 1; }
}

/* List presentation */
.bookmark-list .card { flex-direction: row; align-items: center; padding: 8px 10px; gap: 10px; }
.bookmark-list .card-main { align-items: center; }
.bookmark-list .card-body { gap: 0; }
.bookmark-list .card-title-row { flex-direction: row; align-items: baseline; gap: 8px; }
.bookmark-list .card-title { -webkit-line-clamp: 1; }
.bookmark-list .card-host { flex: none; }
.bookmark-list .card-desc { -webkit-line-clamp: 1; margin-top: 2px; }
.bookmark-list .card-chips { margin-top: 3px; }
.bookmark-list .card-actions { flex: none; }

/* ---------- Empty states ---------- */
.empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  padding: 64px 20px;
  border: 1px dashed var(--border-strong);
  border-radius: var(--r-md);
  text-align: center;
}
.empty .icon { width: 22px; height: 22px; color: var(--text-3); }
.empty h2 { font-size: 15px; font-weight: 650; letter-spacing: -.01em; }
.empty p { max-width: 46ch; font-size: 13px; color: var(--text-2); }
.empty-actions { display: flex; gap: 8px; margin-top: 4px; flex-wrap: wrap; justify-content: center; }

/* =========================================================================
   6. MODAL SYSTEM
   ========================================================================= */
.modal-root {
  position: fixed;
  inset: 0;
  z-index: 120;
  display: grid;
  place-items: center;
  padding: 16px;
}
.modal-root[hidden] { display: none; }

.modal-backdrop { position: absolute; inset: 0; background: var(--overlay); }

.modal {
  position: relative;
  width: 100%;
  max-width: 520px;
  max-height: min(88vh, 780px);
  display: flex;
  flex-direction: column;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-md);
  overflow: hidden;
  animation: modal-in .16s ease;
}
@keyframes modal-in {
  from { opacity: 0; transform: translateY(6px) scale(.994); }
  to   { opacity: 1; transform: none; }
}

.modal-header {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 16px 16px 8px;
}
.modal-title {
  flex: 1;
  min-width: 0;
  font-size: 15px;
  font-weight: 650;
  letter-spacing: -.012em;
  line-height: 1.35;
}
.modal-body { padding: 4px 16px 16px; overflow-y: auto; overscroll-behavior: contain; }
.modal-footer {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  padding: 12px 16px;
  border-top: 1px solid var(--border);
  background: var(--surface);
  flex-wrap: wrap;
}

.dialog-text { font-size: 13px; line-height: 1.55; color: var(--text-2); }
.dialog-text + .dialog-text { margin-top: 8px; }

/* ---------- Forms ---------- */
.field { display: flex; flex-direction: column; gap: 5px; margin-top: 12px; }
.field > label { font-size: 12px; font-weight: 600; color: var(--text-2); }
.field .req { color: var(--text-3); font-weight: 400; }

.field input,
.field textarea,
.field select {
  width: 100%;
  min-height: 36px;
  padding: 7px 10px;
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  background: var(--bg);
  color: var(--text);
  font-size: 13px;
  transition: border-color .14s ease;
}
.field textarea { min-height: 66px; resize: vertical; line-height: 1.5; }
.field input:focus, .field textarea:focus, .field select:focus { border-color: var(--border-strong); outline: none; }
.field input:focus-visible, .field textarea:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 1px; }
.field input::placeholder, .field textarea::placeholder { color: var(--text-3); }

.field input[aria-invalid="true"],
.field textarea[aria-invalid="true"] { border-color: var(--text); }

.hint { font-size: 11.5px; color: var(--text-3); }

.field-error {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  font-weight: 500;
  color: var(--text);
}
.field-error::before {
  content: "!";
  display: inline-grid;
  place-items: center;
  width: 14px; height: 14px;
  flex: none;
  border-radius: 50%;
  background: var(--invert-bg);
  color: var(--invert-fg);
  font-size: 10px;
  font-weight: 700;
  line-height: 1;
}

.checkbox {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 14px;
  font-size: 13px;
  color: var(--text);
  cursor: pointer;
}
.checkbox input { width: 15px; height: 15px; accent-color: var(--text); cursor: pointer; }

.field-row { display: flex; gap: 10px; flex-wrap: wrap; }
.field-row > .field { flex: 1 1 180px; }

/* ---------- Settings ---------- */
.settings-section { padding: 14px 0; border-top: 1px solid var(--border); }
.settings-section:first-child { border-top: 0; padding-top: 4px; }
.settings-title {
  font-size: 11px;
  font-weight: 650;
  letter-spacing: .07em;
  text-transform: uppercase;
  color: var(--text-3);
  margin-bottom: 8px;
}
.settings-note { font-size: 12px; line-height: 1.55; color: var(--text-2); margin-top: 8px; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; }

.dropzone {
  margin-top: 10px;
  padding: 14px;
  border: 1px dashed var(--border-strong);
  border-radius: var(--r-sm);
  font-size: 12px;
  color: var(--text-3);
  text-align: center;
  transition: border-color .14s ease, background-color .14s ease, color .14s ease;
}
.dropzone.is-over { border-color: var(--text); color: var(--text); background: var(--surface-2); }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }
.stats > div {
  padding: 8px 10px;
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  background: var(--surface-2);
}
.stats dt { font-size: 11px; color: var(--text-3); }
.stats dd { font-size: 15px; font-weight: 650; font-variant-numeric: tabular-nums; }

.kbd-list { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; font-size: 12.5px; color: var(--text-2); }
kbd {
  display: inline-block;
  min-width: 20px;
  padding: 1px 5px;
  border: 1px solid var(--border-strong);
  border-bottom-width: 2px;
  border-radius: 4px;
  background: var(--surface-2);
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text);
  text-align: center;
}

/* ---------- Toasts ---------- */
.toast-region {
  position: fixed;
  right: 16px;
  bottom: 16px;
  z-index: 200;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 8px;
  pointer-events: none;
}
.toast {
  pointer-events: auto;
  display: flex;
  align-items: center;
  gap: 8px;
  max-width: 360px;
  padding: 9px 12px;
  border-radius: var(--r-sm);
  background: var(--invert-bg);
  color: var(--invert-fg);
  font-size: 12.5px;
  font-weight: 500;
  box-shadow: var(--shadow-md);
  animation: toast-in .16s ease;
  cursor: default;
}
.toast span { min-width: 0; overflow-wrap: anywhere; }
.toast button {
  margin-left: 4px;
  padding: 2px 7px;
  border: 1px solid currentColor;
  border-radius: 4px;
  background: transparent;
  color: inherit;
  font-size: 11.5px;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
}
.toast button:hover { opacity: .8; }

@keyframes toast-in {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: none; }
}

/* =========================================================================
   7. RESPONSIVE
   ========================================================================= */
@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; }

  .sidebar {
    position: fixed;
    top: 0; bottom: 0; left: 0;
    width: min(84vw, 300px);
    height: 100dvh;
    transform: translateX(-102%);
    transition: transform .2s ease;
    border-right: 1px solid var(--border);
    box-shadow: var(--shadow-md);
  }
  .sidebar.is-open { transform: none; }

  .menu-btn { display: inline-flex; }

  .main { padding: 16px 16px 80px; }
  .topbar { align-items: center; flex-wrap: wrap; }
  .topbar h1 { font-size: 18px; }
  .topbar-actions { margin-left: auto; }

  .bookmark-grid { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }

  .bookmark-list .card { flex-direction: column; align-items: stretch; }
  .bookmark-list .card-actions { justify-content: flex-end; }
}

@media (max-width: 560px) {
  .main { padding: 14px 12px 90px; gap: 12px; }
  .topbar-actions .btn { height: 32px; padding: 0 10px; }
  .btn-add-label { display: none; }
  .bookmark-grid { grid-template-columns: 1fr; }
  .toolbar { gap: 8px; }
  .search { flex-basis: 100%; }
  .toolbar-right { margin-left: auto; }
  .toast-region { left: 12px; right: 12px; bottom: 12px; align-items: stretch; }
  .toast { max-width: none; }
  .modal-root { padding: 0; align-items: end; }
  .modal {
    max-width: none;
    max-height: 92dvh;
    border-radius: var(--r-lg) var(--r-lg) 0 0;
    border-bottom: 0;
  }
}

/* =========================================================================

  *, *::before, *::after {
    animation-duration: .001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .001ms !important;
    scroll-behavior: auto !important;
  }
}

<script>
/* =========================================================================
   BOOKMARK MANAGER — application script
   -------------------------------------------------------------------------
   Sections
     1.  Constants & configuration
     2.  Small utilities (DOM, text, URL, ids, dates)
     3.  Storage layer (read / validate / migrate / write)
     4.  Application state
     5.  Selectors (filter / search / sort)
     6.  Rendering
     7.  Dialog system
     8.  Toasts
     9.  Bookmark form
     10. Category management
     11. Import / export
     12. Event wiring
     13. Bootstrap
   ========================================================================= */
(function () {
  'use strict';

  /* =======================================================================
     1. CONSTANTS & CONFIGURATION
     ======================================================================= */

  const STORAGE_KEY = 'bookmark-manager.state.v1';
  const SCHEMA_VERSION = 1;
  const EXPORT_FORMAT = 'bookmark-manager';
  const RECENT_WINDOW_DAYS = 30;

  const LIMITS = {
    url: 2048,
    title: 200,
    description: 1000,
    category: 40,
    tag: 32,
    tagsPerBookmark: 12,
    categories: 200,
    importBytes: 5 * 1024 * 1024,
    importRecords: 5000
  };

  const SORT_OPTIONS = ['recent', 'oldest', 'updated', 'title-asc', 'title-desc', 'domain'];
  const VIEW_MODES = ['grid', 'list'];
  const THEME_OPTIONS = ['light', 'dark', 'system'];

  const VIEW_META = {
    all: { title: 'All Bookmarks', desc: 'Everything you have saved.' },
    favorites: { title: 'Favorites', desc: 'Bookmarks you starred for quick access.' },
    recent: { title: 'Recently Added', desc: 'Saved in the last 30 days.' },
    archive: { title: 'Archive', desc: 'Bookmarks set aside but kept for later.' },
    trash: { title: 'Trash', desc: 'Deleted bookmarks. Restore them or delete them forever.' },
    category: { title: 'Category', desc: 'Bookmarks in this category.' }
  };

  /* =======================================================================
     2. UTILITIES
     ======================================================================= */

  const $ = (id) => document.getElementById(id);

  /** Create an element with optional class and text. Never uses innerHTML. */
  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined && text !== null) node.textContent = String(text);
    return node;
  }

  const SVG_NS = 'http://www.w3.org/2000/svg';
  const XLINK_NS = 'http://www.w3.org/1999/xlink';

  /** Build an <svg><use href="#i-name"></use></svg> icon node. */
  function svgIcon(name, extraClass) {
    const svg = document.createElementNS(SVG_NS, 'svg');
    svg.setAttribute('class', 'icon' + (extraClass ? ' ' + extraClass : ''));
    svg.setAttribute('aria-hidden', 'true');
    svg.setAttribute('focusable', 'false');
    const use = document.createElementNS(SVG_NS, 'use');
    use.setAttribute('href', '#i-' + name);
    use.setAttributeNS(XLINK_NS, 'xlink:href', '#i-' + name);
    svg.appendChild(use);
    return svg;
  }

  /** Unique identifier that does not depend on array position. */
  function uid(prefix) {
    const p = prefix || 'id';
    if (window.crypto && typeof window.crypto.randomUUID === 'function') {
      return p + '_' + window.crypto.randomUUID();
    }
    return p + '_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 10);
  }

  /** Collapse whitespace, strip control characters, trim, and cap length. */
  function cleanText(value, maxLength) {
    if (typeof value !== 'string') return '';
    const stripped = value.replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F\u007F]/g, '');
    return stripped.replace(/\s+/g, ' ').trim().slice(0, maxLength);
  }

  /** Same as cleanText but preserves line breaks (for descriptions). */
  function cleanMultiline(value, maxLength) {
    if (typeof value !== 'string') return '';
    const stripped = value.replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F\u007F]/g, '');
    return stripped.trim().slice(0, maxLength);
  }

  /**
   * Normalise user-supplied URL input.
   * SECURITY: only http: and https: are accepted. javascript:, data:, file:,
   * blob: and every other scheme are rejected outright. Parsing is delegated to
   * the browser's URL implementation so relative/garbage input fails safely.
   * Returns a canonical absolute href, or null when invalid.
   */
  function normalizeUrl(raw) {
    if (typeof raw !== 'string') return null;
    let value = raw.trim();
    if (!value || value.length > LIMITS.url) return null;
    // Add an implicit https:// scheme when the user omits one.
    if (!/^[a-z][a-z0-9+.-]*:/i.test(value)) value = 'https://' + value;

    let parsed;
    try {
      parsed = new URL(value);
    } catch (err) {
      return null;
    }
    if (parsed.protocol !== 'http:' && parsed.protocol !== 'https:') return null;
    if (!parsed.hostname) return null;
    return parsed.href;
  }

  /** Hostname without a leading "www.". */
  function hostnameOf(url) {
    try {
      return new URL(url).hostname.replace(/^www\./i, '');
    } catch (err) {
      return '';
    }
  }

  /** First letter of the registrable label, used for the site monogram. */
  function monogramFor(url) {
    const host = hostnameOf(url);
    const label = host.split('.').filter(Boolean)[0] || '?';
    return label.charAt(0).toUpperCase();
  }

  /** A sensible starting title derived from the URL (fully editable). */
  function titleFromUrl(url) {
    const host = hostnameOf(url);
    if (host) return host;
    try {
      return new URL(url).hostname || '';
    } catch (err) {
      return '';
    }
  }

  function nowIso() {
    return new Date().toISOString();
  }

  /** Parse a value into a valid ISO string, falling back to a default. */
  function isoOr(value, fallback) {
    if (typeof value === 'string') {
      const t = Date.parse(value);
      if (Number.isFinite(t)) return new Date(t).toISOString();
    }
    if (typeof value === 'number' && Number.isFinite(value)) {
      const d = new Date(value);
      if (!Number.isNaN(d.getTime())) return d.toISOString();
    }
    return fallback;
  }

  function formatDate(iso) {
    const d = new Date(iso);
    if (Number.isNaN(d.getTime())) return '';
    return d.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
  }

  function truncate(text, max) {
    const s = String(text || '');
    return s.length > max ? s.slice(0, max - 1) + '…' : s;
  }

  function isTypingTarget(node) {
    if (!node || !node.tagName) return false;
    const tag = node.tagName;
    return tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || node.isContentEditable === true;
  }

  /* =======================================================================
     3. STORAGE LAYER
     ======================================================================= */

  let storageAvailable = true;   // false when localStorage throws (blocked/private)
  let saveBlocked = false;       // true while corrupt data awaits a user decision
  let recoveryReason = '';       // human-readable explanation for the banner
  let rawBackup = null;          // original corrupt payload, kept for recovery
  let lastSavedJson = null;      // avoids redundant writes

  function defaultState() {
    return {
      version: SCHEMA_VERSION,
      bookmarks: [],
      categories: [],
      prefs: { theme: 'system', view: 'grid', sort: 'recent' }
    };
  }

  /** Read the raw JSON string from localStorage. Never throws. */
  function readStorage() {
    try {
      return window.localStorage.getItem(STORAGE_KEY);
    } catch (err) {
      storageAvailable = false;
      return null;
    }
  }

  /**
   * Write the raw JSON string. Reports quota and blocked-storage problems
   * honestly instead of pretending the save succeeded.
   */
  function writeStorage(json) {
    try {
      window.localStorage.setItem(STORAGE_KEY, json);
      return true;
    } catch (err) {
      const name = err && err.name;
      const isQuota = name === 'QuotaExceededError' || name === 'NS_ERROR_DOM_QUOTA_REACHED' ||
                      (err && (err.code === 22 || err.code === 1014));
      if (isQuota) {
        toast('Storage is full. Export a backup, then remove some bookmarks.', { type: 'error' });
      } else {
        storageAvailable = false;
        toast('This browser is blocking local storage. Changes will not be saved.', { type: 'error' });
      }
      return false;
    }
  }

  /** Persist the current state. Skips writes when nothing has changed. */
  function persist() {
    if (saveBlocked) return false;
    if (!storageAvailable) return false;
    let json;
    try {
      json = JSON.stringify(data);
    } catch (err) {
      toast('Could not serialise your data.', { type: 'error' });
      return false;
    }
    if (json === lastSavedJson) return true;
    const ok = writeStorage(json);
    if (ok) lastSavedJson = json;
    return ok;
  }

  /** Find (case-insensitively) or create a category by name. Mutates `list`. */
  function findOrCreateCategory(name, list) {
    const clean = cleanText(name, LIMITS.category);
    if (!clean) return null;
    const existing = list.find((c) => c.name.toLowerCase() === clean.toLowerCase());
    if (existing) return existing.id;
    if (list.length >= LIMITS.categories) return null;
    const category = { id: uid('cat'), name: clean };
    list.push(category);
    return category.id;
  }

  /** Normalise a tag list: lowercase, de-duplicated, length-capped. */
  function sanitizeTags(raw) {
    const source = Array.isArray(raw)
      ? raw
      : (typeof raw === 'string' ? raw.split(',') : []);
    const out = [];
    const seen = new Set();
    for (const item of source) {
      if (typeof item !== 'string') continue;
      const name = cleanText(item.replace(/,/g, ' '), LIMITS.tag).toLowerCase();
      if (!name || seen.has(name)) continue;
      seen.add(name);
      out.push(name);
      if (out.length >= LIMITS.tagsPerBookmark) break;
    }
    return out;
  }

  /** Resolve a category reference on an imported/stored record. */
  function resolveCategoryId(raw, categories) {
    // Preferred: explicit id that matches a known category.
    if (typeof raw.categoryId === 'string') {
      const found = categories.find((c) => c.id === raw.categoryId);
      if (found) return found.id;
    }
    // Fallback: a plain category name (legacy / hand-written exports).
    if (typeof raw.category === 'string' && raw.category.trim()) {
      return findOrCreateCategory(raw.category, categories);
    }
    return null;
  }

  /**
   * Validate and coerce a single bookmark record from untrusted input.
   * Returns a safe, fully-typed object or null when unusable.
   */
  function sanitizeBookmark(raw, categories, seenUrls) {
    if (!raw || typeof raw !== 'object') return null;

    const url = normalizeUrl(typeof raw.url === 'string' ? raw.url : '');
    if (!url) return null;

    const urlKey = url.toLowerCase();
    if (seenUrls) {
      if (seenUrls.has(urlKey)) return null;
      seenUrls.add(urlKey);
    }

    const createdAt = isoOr(raw.createdAt, nowIso());
    const updatedAt = isoOr(raw.updatedAt, createdAt);
    const deleted = raw.deleted === true;
    const deletedAt = deleted ? isoOr(raw.deletedAt, updatedAt) : null;

    return {
      id: (typeof raw.id === 'string' && /^[A-Za-z0-9_-]{1,80}$/.test(raw.id)) ? raw.id : uid('bm'),
      url: url,
      title: cleanText(raw.title, LIMITS.title) || titleFromUrl(url),
      description: cleanMultiline(raw.description, LIMITS.description),
      categoryId: resolveCategoryId(raw, categories),
      tags: sanitizeTags(raw.tags),
      favorite: raw.favorite === true,
      archived: raw.archived === true,
      deleted: deleted,
      deletedAt: deletedAt,
      createdAt: createdAt,
      updatedAt: updatedAt
    };
  }

  /**
   * Turn arbitrary parsed JSON into a trustworthy state object.
   * Unknown/extra fields are dropped; malformed records are skipped.
   */
  function sanitizeState(parsed) {
    const out = defaultState();
    if (!parsed || typeof parsed !== 'object') return out;

    // Categories first, so bookmarks can resolve their references.
    const byName = new Map();
    if (Array.isArray(parsed.categories)) {
      for (const raw of parsed.categories.slice(0, LIMITS.categories)) {
        if (!raw || typeof raw !== 'object') continue;
        const name = cleanText(raw.name, LIMITS.category);
        if (!name) continue;
        const key = name.toLowerCase();
        if (byName.has(key)) continue;
        const id = (typeof raw.id === 'string' && /^[A-Za-z0-9_-]{1,80}$/.test(raw.id))
          ? raw.id : uid('cat');
        byName.set(key, { id: id, name: name });
      }
    }
    out.categories = Array.from(byName.values());

    // Bookmarks
    if (Array.isArray(parsed.bookmarks)) {
      const seenUrls = new Set();
      const seenIds = new Set();
      for (const raw of parsed.bookmarks.slice(0, LIMITS.importRecords)) {
        const bookmark = sanitizeBookmark(raw, out.categories, seenUrls);
        if (!bookmark) continue;
        if (seenIds.has(bookmark.id)) bookmark.id = uid('bm');
        seenIds.add(bookmark.id);
        out.bookmarks.push(bookmark);
      }
    }

    // Preferences
    const prefs = (parsed.prefs && typeof parsed.prefs === 'object') ? parsed.prefs : {};
    out.prefs = {
      theme: THEME_OPTIONS.indexOf(prefs.theme) !== -1 ? prefs.theme : 'system',
      view: VIEW_MODES.indexOf(prefs.view) !== -1 ? prefs.view : 'grid',
      sort: SORT_OPTIONS.indexOf(prefs.sort) !== -1 ? prefs.sort : 'recent'
    };

    return out;
  }

  /** Enter a read-only recovery mode so corrupt data is never overwritten. */
  function enterRecoveryMode(raw, reason) {
    saveBlocked = true;
    rawBackup = raw;
    recoveryReason = reason;
    data = defaultState();
    lastSavedJson = raw;
  }

  /** Load, validate and migrate persisted state. */
  function loadApp() {
    const raw = readStorage();

    if (raw === null || raw === '') {
      data = defaultState();
      lastSavedJson = null;
      return;
    }

    let parsed;
    try {
      parsed = JSON.parse(raw);
    } catch (err) {
      enterRecoveryMode(raw, 'The saved data could not be parsed as JSON.');
      return;
    }

    if (!parsed || typeof parsed !== 'object' || Array.isArray(parsed)) {
      enterRecoveryMode(raw, 'The saved data has an unexpected structure.');
      return;
    }

    const version = Number(parsed.version);
    if (Number.isFinite(version) && version > SCHEMA_VERSION) {
      enterRecoveryMode(raw, 'The saved data was created by a newer version of this app.');
      return;
    }

    data = sanitizeState(parsed);
    lastSavedJson = raw; // forces a rewrite of the sanitised form on next change
  }

  /* =======================================================================
     4. APPLICATION STATE
     ======================================================================= */

  let data = defaultState();

  /** Volatile view state — intentionally not persisted. */
  const ui = {
    view: 'all',
    categoryId: null,
    query: '',
    tag: null,
    drawerOpen: false
  };

  /* =======================================================================
     5. SELECTORS
     ======================================================================= */

  function categoryById(id) {
    if (!id) return null;
    return data.categories.find((c) => c.id === id) || null;
  }

  function categoryName(id) {
    const category = categoryById(id);
    return category ? category.name : '';
  }

  function isRecent(bookmark) {
    const t = Date.parse(bookmark.createdAt);
    if (!Number.isFinite(t)) return false;
    return Date.now() - t < RECENT_WINDOW_DAYS * 86400000;
  }

  /** Does this bookmark belong to the currently selected view? */
  function matchesView(bookmark) {
    if (ui.view === 'trash') return bookmark.deleted;
    if (bookmark.deleted) return false;
    if (ui.view === 'archive') return bookmark.archived;
    if (bookmark.archived) return false;
    if (ui.view === 'favorites') return bookmark.favorite;
    if (ui.view === 'recent') return isRecent(bookmark);
    if (ui.view === 'category') return bookmark.categoryId === ui.categoryId;
    return true;
  }

  function searchHaystack(bookmark) {
    return [
      bookmark.title,
      bookmark.url,
      hostnameOf(bookmark.url),
      bookmark.description,
      categoryName(bookmark.categoryId),
      bookmark.tags.join(' ')
    ].join(' ').toLowerCase();
  }

  function sortBookmarks(list, mode) {
    const sorted = list.slice();
    const byTitle = (a, b) => a.title.localeCompare(b.title, undefined, { sensitivity: 'base' });
    const byDomain = (a, b) => {
      const ha = hostnameOf(a.url).toLowerCase();
      const hb = hostnameOf(b.url).toLowerCase();
      if (ha !== hb) return ha < hb ? -1 : 1;
      return byTitle(a, b);
    };

    switch (mode) {
      case 'oldest':
        sorted.sort((a, b) => a.createdAt.localeCompare(b.createdAt));
        break;
      case 'updated':
        sorted.sort((a, b) => b.updatedAt.localeCompare(a.updatedAt));
        break;
      case 'title-asc':
        sorted.sort(byTitle);
        break;
      case 'title-desc':
        sorted.sort((a, b) => byTitle(b, a));
        break;
      case 'domain':
        sorted.sort(byDomain);
        break;
      case 'recent':
      default:
        sorted.sort((a, b) => b.createdAt.localeCompare(a.createdAt));
        break;
    }
    return sorted;
  }

  /** Apply view → tag filter → search → sort, in that order. */
  function getVisibleBookmarks() {
    const query = ui.query.trim().toLowerCase();
    let list = data.bookmarks.filter(matchesView);

    if (ui.tag) {
      const tag = ui.tag;
      list = list.filter((b) => b.tags.indexOf(tag) !== -1);
    }

    if (query) {
      list = list.filter((b) => searchHaystack(b).indexOf(query) !== -1);
    }

    return sortBookmarks(list, data.prefs.sort);
  }

  /** Aggregate counts used by the sidebar badges. */
  function computeCounts() {
    const counts = { all: 0, favorites: 0, recent: 0, archive: 0, trash: 0 };
    const byCategory = new Map();

    for (const bookmark of data.bookmarks) {
      if (bookmark.deleted) { counts.trash += 1; continue; }
      if (bookmark.archived) { counts.archive += 1; continue; }
      counts.all += 1;
      if (bookmark.favorite) counts.favorites += 1;
      if (isRecent(bookmark)) counts.recent += 1;
      if (bookmark.categoryId) {
        byCategory.set(bookmark.categoryId, (byCategory.get(bookmark.categoryId) || 0) + 1);
      }
    }
    return { counts: counts, byCategory: byCategory };
  }

  /* =======================================================================
     6. RENDERING
     ======================================================================= */

  function render() {
    renderSidebar();
    renderHeader();
    renderBanner();
    renderActiveFilters();
    renderList();
    renderThemeButton();
  }

  function renderSidebar() {
    const { counts, byCategory } = computeCounts();

    document.querySelectorAll('#mainNav .nav-item').forEach((btn) => {
      const view = btn.dataset.view;
      const countEl = btn.querySelector('.nav-count');
      if (countEl) countEl.textContent = String(counts[view] || 0);
      if (ui.view === view) {
        btn.setAttribute('aria-current', 'page');
      } else {
        btn.removeAttribute('aria-current');
      }
    });

    const list = $('categoryList');
    list.textContent = '';

    if (!data.categories.length) {
      list.appendChild(el('p', 'nav-empty', 'No categories yet'));
      return;
    }

    const sorted = data.categories.slice().sort((a, b) =>
      a.name.localeCompare(b.name, undefined, { sensitivity: 'base' }));

    for (const category of sorted) {
      const btn = el('button', 'nav-item');
      btn.type = 'button';
      btn.dataset.view = 'category';
      btn.dataset.categoryId = category.id;

      const icon = svgIcon('folder');
      btn.appendChild(icon);
      btn.appendChild(el('span', 'nav-label', category.name));
      btn.appendChild(el('span', 'nav-count', String(byCategory.get(category.id) || 0)));

      if (ui.view === 'category' && ui.categoryId === category.id) {
        btn.setAttribute('aria-current', 'page');
      }
      list.appendChild(btn);
    }
  }

  function renderHeader() {
    const meta = VIEW_META[ui.view] || VIEW_META.all;
    let title = meta.title;
    let desc = meta.desc;

    if (ui.view === 'category') {
      const category = categoryById(ui.categoryId);
      title = category ? category.name : 'Category';
      desc = 'Bookmarks in this category.';
    }

    $('pageTitle').textContent = title;
    $('pageDesc').textContent = desc;

    // Category rename/delete affordances
    const admin = $('categoryAdmin');
    admin.textContent = '';

    if (ui.view === 'category' && categoryById(ui.categoryId)) {
      const rename = el('button', 'btn btn--ghost btn--sm', 'Rename');
      rename.type = 'button';
      rename.addEventListener('click', () => renameCategory(ui.categoryId));

      const remove = el('button', 'btn btn--ghost btn--sm', 'Delete');
      remove.type = 'button';
      remove.addEventListener('click', () => deleteCategory(ui.categoryId));

      admin.append(rename, remove);
    }

    $('sortSelect').value = data.prefs.sort;

    document.querySelectorAll('#viewToggle button').forEach((btn) => {
      btn.setAttribute('aria-pressed', String(btn.dataset.viewmode === data.prefs.view));
    });
  }

  function renderBanner() {
    const banner = $('banner');
    banner.textContent = '';

    if (!saveBlocked) {
      banner.hidden = true;
      return;
    }

    banner.hidden = false;
    const box = el('div', 'banner');
    box.appendChild(svgIcon('alert'));

    const body = el('div', 'banner-body');
    body.appendChild(el('p', 'banner-title', 'Your saved data could not be loaded'));
    body.appendChild(el('p', 'banner-text',
      (recoveryReason || 'The stored data is unreadable.') +
      ' Nothing has been overwritten — download a copy before choosing what to do.'));

    const actions = el('div', 'banner-actions');

    const download = el('button', 'btn btn--sm', 'Download saved data');
    download.type = 'button';
    download.addEventListener('click', () => {
      downloadFile('bookmark-manager-raw-backup.json', rawBackup || '', 'application/json');
      toast('Raw backup downloaded.');
    });

    const reset = el('button', 'btn btn--sm btn--primary', 'Start fresh');
    reset.type = 'button';
    reset.addEventListener('click', async () => {
      const ok = await confirmDialog({
        title: 'Start with empty data?',
        message: 'This permanently discards the unreadable saved data. Make sure you have downloaded a copy first.',
        confirmLabel: 'Discard and start fresh'
      });
      if (!ok) return;
      saveBlocked = false;
      rawBackup = null;
      recoveryReason = '';
      data = defaultState();
      lastSavedJson = null;
      persist();
      applyTheme();
      render();
      toast('Storage reset. You can start adding bookmarks.');
    });

    actions.append(download, reset);
    body.appendChild(actions);
    box.appendChild(body);
    banner.appendChild(box);
  }

  function renderActiveFilters() {
    const host = $('activeFilters');
    host.textContent = '';
    if (!ui.tag) return;

    const chip = el('button', 'chip', '#' + ui.tag);
    chip.type = 'button';
    chip.setAttribute('aria-label', 'Remove tag filter ' + ui.tag);
    chip.dataset.action = 'clear-tag';
    chip.appendChild(svgIcon('x', 'icon--sm'));
    host.appendChild(chip);
  }

  function renderThemeButton() {
    const btn = $('themeToggle');
    const resolved = document.documentElement.getAttribute('data-theme') || 'light';
    btn.textContent = '';
    btn.appendChild(svgIcon(resolved === 'dark' ? 'sun' : 'moon'));
    btn.setAttribute('aria-label', resolved === 'dark' ? 'Switch to light theme' : 'Switch to dark theme');
    btn.title = btn.getAttribute('aria-label');
  }

  /* ------------------------------ List ------------------------------ */

  function renderList() {
    const content = $('content');
    content.textContent = '';

    const items = getVisibleBookmarks();

    // Meta line
    const countLabel = items.length === 1 ? '1 bookmark' : items.length + ' bookmarks';
    $('listCount').textContent = data.bookmarks.length ? countLabel : '';

    if (!data.bookmarks.length) {
      content.appendChild(buildEmptyState('onboarding'));
      return;
    }

    if (!items.length) {
      content.appendChild(buildEmptyState('no-results'));
      return;
    }

    const container = el('div', data.prefs.view === 'list' ? 'bookmark-list' : 'bookmark-grid');
    const fragment = document.createDocumentFragment();
    for (const bookmark of items) {
      fragment.appendChild(buildCard(bookmark));
    }
    container.appendChild(fragment);
    content.appendChild(container);
  }

  function actionButton(options) {
    const btn = el('button', 'icon-btn card-action' + (options.className ? ' ' + options.className : ''));
    btn.type = 'button';
    btn.dataset.action = options.action;
    btn.setAttribute('aria-label', options.label);
    btn.title = options.label;
    if (typeof options.pressed === 'boolean') {
      btn.setAttribute('aria-pressed', String(options.pressed));
    }
    btn.appendChild(svgIcon(options.icon));
    return btn;
  }

  function buildCard(bookmark) {
    const card = el('article', 'card');
    card.dataset.bookmarkId = bookmark.id;

    const labelSuffix = truncate(bookmark.title, 60);

    /* --- main block --- */
    const main = el('div', 'card-main');

    const mark = el('span', 'site-mark', monogramFor(bookmark.url));
    mark.setAttribute('aria-hidden', 'true');

    const body = el('div', 'card-body');

    const titleRow = el('div', 'card-title-row');

    const link = el('a', 'card-title', bookmark.title);
    link.href = bookmark.url;
    link.target = '_blank';
    link.rel = 'noopener noreferrer';
    link.title = bookmark.title;
    titleRow.appendChild(link);

    const host = hostnameOf(bookmark.url);
    if (host) titleRow.appendChild(el('span', 'card-host', host));

    body.appendChild(titleRow);

    if (bookmark.description) {
      body.appendChild(el('p', 'card-desc', bookmark.description));
    }

    const chips = el('div', 'card-chips');
    const catName = categoryName(bookmark.categoryId);
    if (catName) {
      const chip = el('button', 'chip chip--cat', catName);
      chip.type = 'button';
      chip.dataset.action = 'filter-category';
      chip.dataset.categoryId = bookmark.categoryId;
      chip.title = 'Show bookmarks in ' + catName;
      chips.appendChild(chip);
    }
    for (const tag of bookmark.tags) {
      const chip = el('button', 'chip', '#' + tag);
      chip.type = 'button';
      chip.dataset.action = 'filter-tag';
      chip.dataset.tag = tag;
      chip.title = 'Filter by tag ' + tag;
      chips.appendChild(chip);
    }
    if (chips.childNodes.length) body.appendChild(chips);

    main.append(mark, body);

    /* --- actions --- */
    const actions = el('div', 'card-actions');

    if (bookmark.deleted) {
      actions.appendChild(actionButton({
        action: 'restore', icon: 'restore',
        label: 'Restore “' + labelSuffix + '”'
      }));
      actions.appendChild(actionButton({
        action: 'purge', icon: 'trash',
        label: 'Delete “' + labelSuffix + '” permanently'
      }));
    } else {
      actions.appendChild(actionButton({
        action: 'favorite', icon: 'star', className: 'star-btn',
        pressed: bookmark.favorite,
        label: (bookmark.favorite ? 'Remove “' : 'Mark “') + labelSuffix +
               (bookmark.favorite ? '” from favorites' : '” as favorite')
      }));
      actions.appendChild(actionButton({
        action: 'edit', icon: 'edit',
        label: 'Edit “' + labelSuffix + '”'
      }));
      if (bookmark.archived) {
        actions.appendChild(actionButton({
          action: 'unarchive', icon: 'unarchive',
          label: 'Restore “' + labelSuffix + '” from archive'
        }));
      } else {
        actions.appendChild(actionButton({
          action: 'archive', icon: 'archive',
          label: 'Archive “' + labelSuffix + '”'
        }));
      }
      actions.appendChild(actionButton({
        action: 'trash', icon: 'trash',
        label: 'Move “' + labelSuffix + '” to trash'
      }));
    }

    card.append(main, actions);
    return card;
  }

  function buildEmptyState(kind) {
    const box = el('div', 'empty');

    if (kind === 'onboarding') {
      box.appendChild(svgIcon('inbox'));
      box.appendChild(el('h2', null, 'No bookmarks yet'));
      box.appendChild(el('p', null,
        'Save your first link and it will stay in this browser. ' +
        'You can organize everything with categories, tags and favorites.'));

      const actions = el('div', 'empty-actions');
      const add = el('button', 'btn btn--primary', 'Add your first bookmark');
      add.type = 'button';
      add.dataset.action = 'add';

      const demo = el('button', 'btn', 'Load sample data');
      demo.type = 'button';
      demo.dataset.action = 'demo';

      actions.append(add, demo);
      box.appendChild(actions);
      return box;
    }

    // No results
    box.appendChild(svgIcon('search'));
    box.appendChild(el('h2', null, 'No matching bookmarks'));

    let message = 'Nothing matched your current filters.';
    if (ui.query.trim()) {
      message = 'No bookmark matches “' + truncate(ui.query.trim(), 60) + '”. Try a different word.';
    } else if (ui.tag) {
      message = 'No bookmark in this view carries the tag “' + ui.tag + '”.';
    }
    box.appendChild(el('p', null, message));

    const actions = el('div', 'empty-actions');
    if (ui.query.trim() || ui.tag) {
      const clear = el('button', 'btn', 'Clear filters');
      clear.type = 'button';
      clear.dataset.action = 'clear-filters';
      actions.appendChild(clear);
    }
    const add = el('button', 'btn btn--primary', 'Add bookmark');
    add.type = 'button';
    add.dataset.action = 'add';
    actions.appendChild(add);

    box.appendChild(actions);
    return box;
  }

  /* =======================================================================
     7. DIALOG SYSTEM
     ======================================================================= */

  let dialog = null; // { modal, onClose, previouslyFocused, dismissible }

  /**
   * Open a modal dialog.
   * options: { title, description, body (Node), footer (Node|null),
   *            width, dismissible, onClose }
   */
  function openDialog(options) {
    closeDialog();

    const root = $('modalRoot');
    const host = $('modalHost');
    host.textContent = '';

    const modal = el('div', 'modal');
    if (options.width) modal.style.maxWidth = options.width;
    modal.setAttribute('role', 'dialog');
    modal.setAttribute('aria-modal', 'true');

    const titleId = uid('dialogtitle');
    modal.setAttribute('aria-labelledby', titleId);

    const header = el('div', 'modal-header');
    const heading = el('h2', 'modal-title', options.title || 'Dialog');
    heading.id = titleId;
    header.appendChild(heading);

    const closeBtn = el('button', 'icon-btn');
    closeBtn.type = 'button';
    closeBtn.setAttribute('aria-label', 'Close dialog');
    closeBtn.appendChild(svgIcon('x'));
    closeBtn.addEventListener('click', () => closeDialog());
    header.appendChild(closeBtn);

    const body = el('div', 'modal-body');
    if (options.description) body.appendChild(el('p', 'dialog-text', options.description));
    if (options.body) body.appendChild(options.body);

    modal.append(header, body);
    if (options.footer) modal.appendChild(options.footer);

    host.appendChild(modal);
    root.hidden = false;
    document.body.classList.add('is-locked');

    dialog = {
      modal: modal,
      onClose: options.onClose || null,
      previouslyFocused: document.activeElement,
      dismissible: options.dismissible !== false
    };

    const preferred = modal.querySelector('[data-autofocus]');
    const fallback = modal.querySelector(
      'input:not([type="hidden"]), textarea, select, button, [tabindex]:not([tabindex="-1"])');
    (preferred || fallback || modal).focus();

    document.addEventListener('keydown', onDialogKeydown, true);
  }

  function closeDialog() {
    if (!dialog) return;
    const closing = dialog;
    dialog = null;

    document.removeEventListener('keydown', onDialogKeydown, true);
    document.body.classList.remove('is-locked');
    $('modalHost').textContent = '';
    $('modalRoot').hidden = true;

    const target = closing.previouslyFocused;
    if (target && typeof target.focus === 'function' && document.contains(target)) {
      target.focus();
    }
    if (typeof closing.onClose === 'function') closing.onClose();
  }

  function onDialogKeydown(event) {
    if (!dialog) return;

    if (event.key === 'Escape') {
      event.preventDefault();
      event.stopPropagation();
      if (dialog.dismissible) closeDialog();
      return;
    }

    if (event.key !== 'Tab') return;

    const selector = 'a[href], button:not([disabled]), input:not([disabled]), ' +
                     'select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])';
    const focusables = Array.prototype.filter.call(
      dialog.modal.querySelectorAll(selector),
      (node) => node.offsetWidth > 0 || node.offsetHeight > 0 || node === document.activeElement
    );

    if (!focusables.length) {
      event.preventDefault();
      return;
    }

    const first = focusables[0];
    const last = focusables[focusables.length - 1];

    if (event.shiftKey && document.activeElement === first) {
      event.preventDefault();
      last.focus();
    } else if (!event.shiftKey && document.activeElement === last) {
      event.preventDefault();
      first.focus();
    }
  }

  function buildDialogFooter(buttons) {
    const footer = el('div', 'modal-footer');
    for (const config of buttons) {
      const btn = el('button', 'btn' + (config.variant === 'primary' ? ' btn--primary' : ''));
      btn.type = 'button';
      btn.textContent = config.label;
      btn.addEventListener('click', () => {
        const result = config.onClick ? config.onClick() : true;
        if (result !== false) closeDialog();
      });
      footer.appendChild(btn);
    }
    return footer;
  }

  /** Promise-based confirmation dialog. Resolves true when confirmed. */
  function confirmDialog(config) {
    return new Promise((resolve) => {
      let settled = false;
      const finish = (value) => {
        if (settled) return;
        settled = true;
        resolve(value);
      };

      openDialog({
        title: config.title || 'Are you sure?',
        body: el('p', 'dialog-text', config.message || ''),
        width: '440px',
        footer: buildDialogFooter([
          { label: config.cancelLabel || 'Cancel', onClick: () => { finish(false); return true; } },
          {
            label: config.confirmLabel || 'Confirm',
            variant: 'primary',
            onClick: () => { finish(true); return true; }
          }
        ]),
        onClose: () => finish(false)
      });
    });
  }

  /** Promise-based single-line text prompt. Resolves the string, or null. */
  function promptDialog(config) {
    return new Promise((resolve) => {
      let settled = false;
      const finish = (value) => {
        if (settled) return;
        settled = true;
        resolve(value);
      };

      const form = el('form');
      form.noValidate = true;

      const field = el('div', 'field');
      const label = el('label', null, config.label || 'Value');
      label.htmlFor = 'prompt-input';
      const input = el('input');
      input.id = 'prompt-input';
      input.type = 'text';
      input.value = config.value || '';
      input.setAttribute('data-autofocus', '');
      input.maxLength = config.maxLength || 60;
      input.autocomplete = 'off';

      const error = el('p', 'field-error');
      error.hidden = true;

      field.append(label, input, error);
      form.appendChild(field);

      const submit = () => {
        const value = cleanText(input.value, config.maxLength || 60);
        if (!value) {
          error.textContent = config.requiredMessage || 'Please enter a value.';
          error.hidden = false;
          input.setAttribute('aria-invalid', 'true');
          input.focus();
          return;
        }
        finish(value);
        closeDialog();
      };

      form.addEventListener('submit', (event) => {
        event.preventDefault();
        submit();
      });

      openDialog({
        title: config.title || 'Enter a value',
        description: config.description,
        width: '440px',
        body: form,
        footer: buildDialogFooter([
          { label: 'Cancel', onClick: () => { finish(null); return true; } },
          { label: config.confirmLabel || 'Save', variant: 'primary', onClick: submit }
        ]),
        onClose: () => finish(null)
      });
    });
  }

  /* =======================================================================
     8. TOASTS
     ======================================================================= */

  function toast(message, options) {
    const config = options || {};
    const region = $('toastRegion');

    const node = el('div', 'toast');
    node.appendChild(svgIcon(config.type === 'error' ? 'alert' : 'check', 'icon--sm'));
    node.appendChild(el('span', null, message));

    let timer = null;

    const dismiss = () => {
      if (timer) clearTimeout(timer);
      if (node.parentNode) node.parentNode.removeChild(node);
    };

    if (config.actionLabel && typeof config.onAction === 'function') {
      const action = el('button', null, config.actionLabel);
      action.type = 'button';
      action.addEventListener('click', () => {
        dismiss();
        config.onAction();
      });
      node.appendChild(action);
    }

    node.addEventListener('click', (event) => {
      if (event.target === node) dismiss();
    });

    region.appendChild(node);
    timer = setTimeout(dismiss, config.type === 'error' ? 6500 : 4000);

    // Keep the toast region from growing without bound.
    while (region.childElementCount > 4) {
      region.removeChild(region.firstElementChild);
    }
  }

  /* =======================================================================
     9. BOOKMARK FORM

  function openBookmarkForm(existing) {
    const isEdit = Boolean(existing);

    const draft = isEdit
      ? {
          url: existing.url,
          title: existing.title,
          description: existing.description,

          tags: existing.tags.slice(),

        }
      : {
          url: '',
          title: '',
          description: '',

          tags: [],
          favorite: false
        };

    const form = el('form');
    form.noValidate = true;

    /* ---------------- URL ---------------- */

    urlLabel.htmlFor = 'bm-url';
